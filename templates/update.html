<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Task - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f4f6f9; }
      .navbar-brand { font-weight: 700; }
      .card { border-radius: 12px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">⚡ TaskFlow Workspace</a>
      </div>
    </nav>

    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm border-0 p-4">
            <h4 class="fw-bold mb-3 text-primary">Edit Task</h4>
            <form action="/update/{{ task.sno }}" method="POST">
              <div class="mb-3">
                <label for="title" class="form-label fw-semibold">Task Title</label>
                <input type="text" class="form-control" name="title" id="title" value="{{ task.title }}" required>
              </div>
              <div class="mb-3">
                <label for="desc" class="form-label fw-semibold">Description</label>
                <textarea class="form-control" name="desc" id="desc" rows="3" required>{{ task.desc }}</textarea>
              </div>
              <div class="mb-3">
                <label for="priority" class="form-label fw-semibold">Priority Level</label>
                <select class="form-select" name="priority" id="priority">
                  <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                  <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                  <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                </select>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary fw-semibold flex-grow-1">Save Changes</button>
                <a href="/" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
